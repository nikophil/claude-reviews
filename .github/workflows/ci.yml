name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: node --test
      - run: npm install -g @anthropic-ai/claude-code@2.1.325
      - run: npm run test:mod
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  phpstorm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PhpStorm, the Gradle dependencies and the Plugin Verifier, as run.sh and build.gradle.kts pin them.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/phpstorm-cache
          key: phpstorm-${{ hashFiles('phpstorm/ui-test/run.sh', 'phpstorm/ui-test/build.gradle.kts') }}
      - run: mkdir -p "$RUNNER_TEMP/phpstorm-cache"
      - run: npm run test:phpstorm
        env:
          PHPSTORM_CACHE: ${{ runner.temp }}/phpstorm-cache
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phpstorm-ui-test
          path: |
            phpstorm/ui-test/out/ide-tests/tests/*/*/log
            phpstorm/ui-test/build/reports
            var/phpstorm/verifier
