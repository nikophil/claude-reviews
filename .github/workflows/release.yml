name: Release

# A tag v<version> publishes that version: the Claude Code plugin is this repository at the tag,
# and the release of the tag carries the zip of the PhpStorm plugin and the .vsix of the VS Code extension, built at that version.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 25
      - name: The tag names the version of .claude-plugin/plugin.json
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./.claude-plugin/plugin.json").version')"
          echo "PLUGIN_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # PhpStorm, the Gradle dependencies and the Plugin Verifier, as in the phpstorm job of ci.yml.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/phpstorm-cache
          key: phpstorm-${{ hashFiles('phpstorm/ui-test/run.sh', 'phpstorm/ui-test/build.gradle.kts') }}
      - run: mkdir -p "$RUNNER_TEMP/phpstorm-cache"
      # The zip of the release passes the Plugin Verifier and the UI tests, as on a pull request.
      - run: npm run test:phpstorm
        env:
          PHPSTORM_CACHE: ${{ runner.temp }}/phpstorm-cache
      - run: npm run build:vscode
      - run: gh release create "$GITHUB_REF_NAME" var/phpstorm/local-reviews.zip var/vscode/local-reviews.vsix --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
